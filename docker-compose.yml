services:
  db:
    image: postgres:16-alpine
    container_name: opspulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: opspulse
      POSTGRES_PASSWORD: opspulse_dev_password
      POSTGRES_DB: opspulse
    ports:
      - "5432:5432"
    volumes:
      - opspulse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspulse -d opspulse"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  opspulse_data:
